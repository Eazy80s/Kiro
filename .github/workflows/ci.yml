name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Logik-Tests ausführen
        run: npm test
      - name: Chrome einrichten
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Browser-Smoke-Test (headless Chrome)
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node tests/browser.test.mjs
