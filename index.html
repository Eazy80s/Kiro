<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Apps</title>
  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" type="image/svg+xml" href="apps/study/icon.svg" />
  <link rel="apple-touch-icon" href="apps/study/icon-180.png" />
  <script>
    // Theme früh setzen (gleicher Schlüssel wie die Apps), damit es nicht hell aufblitzt.
    (function () {
      try {
        var t = localStorage.getItem("study-tracker-theme") || "auto";
        var dark = t === "dark" || (t === "auto" && window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #ffffff; --surface: #ffffff; --surface-2: #f1f3f5;
      --text: #1a1a1a; --muted: #6b7280; --accent: #4f46e5; --accent-hover: #4338ca;
      --border: #e5e7eb; --radius: 16px;
      --shadow-md: 0 2px 6px rgba(15, 23, 42, 0.06), 0 6px 16px rgba(15, 23, 42, 0.07);
      --shadow-lg: 0 10px 30px rgba(79, 70, 229, 0.18);
    }
    [data-theme="dark"] {
      --bg: #0f172a; --surface: #1e293b; --surface-2: #334155;
      --text: #e2e8f0; --muted: #94a3b8; --accent: #818cf8; --accent-hover: #6366f1;
      --border: #334155;
      --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 30px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.55;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center;
      padding: 48px 20px;
    }
    .launcher-head { text-align: center; margin-bottom: 36px; }
    .launcher-head h1 {
      font-size: 1.9rem; font-weight: 700; letter-spacing: -0.02em;
    }
    .launcher-head p { color: var(--muted); margin-top: 6px; }
    .app-grid {
      display: grid; gap: 18px; width: 100%; max-width: 760px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    }
    .app-tile {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 22px; text-decoration: none;
      color: inherit; box-shadow: var(--shadow-md);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .app-tile:hover, .app-tile:focus-visible {
      transform: translateY(-3px); box-shadow: var(--shadow-lg);
      border-color: var(--accent); outline: none;
    }
    .app-tile .icon {
      width: 56px; height: 56px; border-radius: 14px; display: block;
    }
    .app-tile .app-name { font-size: 1.15rem; font-weight: 650; }
    .app-tile .app-desc { color: var(--muted); font-size: 0.9rem; }
    .launcher-foot { margin-top: 40px; color: var(--muted); font-size: 0.82rem; }
  </style>
</head>
<body>
  <header class="launcher-head">
    <h1>Apps</h1>
    <p>Wähle eine App.</p>
  </header>

  <main class="app-grid">
    <a class="app-tile" href="apps/study/index.html">
      <img class="icon" src="apps/study/icon.svg" alt="" aria-hidden="true" />
      <span class="app-name">🎓 Studien-Tracker</span>
      <span class="app-desc">Module, Kalender, Noten, Pomodoro &amp; Lernzeit.</span>
    </a>
  </main>

  <footer class="launcher-foot">Weitere Apps folgen.</footer>
</body>
</html>
