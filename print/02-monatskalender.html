<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Monatskalender</title>
<link rel="stylesheet" href="print.css">
<style>
  @page { size: A4 landscape; margin: 11mm 11mm 10mm 11mm; }
  .cal { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .cal th { background: var(--surface-2); font-size: 8.5pt; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 4px; }
  .cal td { border: 1px solid var(--grid); height: 32mm; vertical-align: top; padding: 3px 4px; }
  .cal td .dn { font-size: 9pt; font-weight: 700; color: var(--muted); }
  .cal td.we { background: #fafbfc; }
  .legend { margin-bottom: 8px; }
  .dot { display:inline-block; width:3mm;height:3mm;border-radius:50%; vertical-align:-0.3mm; }
</style>
</head>
<body class="landscape">
  <div class="sheet-head">
    <div class="title"><small>🎓 Studien-Tracker · 📅 Kalender</small>Monat <span class="line" style="min-width:60mm"></span></div>
    <div class="meta"><div>Jahr <span class="line"></span></div></div>
  </div>

  <div class="legend">
    <span><span class="dot" style="background:#dc2626"></span> Prüfung</span>
    <span><span class="dot" style="background:#4f46e5"></span> Abgabe</span>
    <span><span class="dot" style="background:#16a34a"></span> Vorlesung</span>
    <span><span class="dot" style="background:#6b7280"></span> Sonstiges</span>
  </div>

  <table class="cal">
    <thead>
      <tr><th>Mo</th><th>Di</th><th>Mi</th><th>Do</th><th>Fr</th><th>Sa</th><th>So</th></tr>
    </thead>
    <tbody>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
      <tr><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td><span class="dn"></span></td><td class="we"><span class="dn"></span></td><td class="we"><span class="dn"></span></td></tr>
    </tbody>
  </table>
</body>
</html>
