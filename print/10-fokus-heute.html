<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Fokus heute</title>
<link rel="stylesheet" href="print.css">
<style>
  .big-check { width:5.5mm;height:5.5mm; }
  .top3 td { height:12mm; }
</style>
</head>
<body>
  <div class="sheet-head">
    <div class="title"><small>🎓 Studien-Tracker · 🎯 Fokus</small>Fokus heute</div>
    <div class="meta"><div>Datum <span class="line"></span></div><div style="margin-top:4px">Lernziel heute <span class="line" style="min-width:26mm"></span></div></div>
  </div>

  <div class="section-label">Die 3 wichtigsten Aufgaben</div>
  <table class="top3">
    <tbody>
      <tr><td style="width:9mm;text-align:center"><span class="box big-check"></span></td><td style="font-size:12pt">1.</td></tr>
      <tr><td style="text-align:center"><span class="box big-check"></span></td><td style="font-size:12pt">2.</td></tr>
      <tr><td style="text-align:center"><span class="box big-check"></span></td><td style="font-size:12pt">3.</td></tr>
    </tbody>
  </table>

  <div class="row" style="margin-top:12px">
    <div class="col">
      <div class="section-label">Weitere Aufgaben & Teilaufgaben</div>
      <table>
        <thead><tr><th style="width:9mm">✓</th><th>Aufgabe</th><th class="c-mid">Modul</th></tr></thead>
        <tbody>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
          <tr><td style="text-align:center"><span class="box"></span></td><td></td><td></td></tr>
        </tbody>
      </table>
    </div>
    <div class="col" style="flex:0 0 58mm">
      <div class="section-label">Pomodoros heute</div>
      <div style="border:1px solid var(--grid);padding:6px;min-height:28mm">
        <div style="font-size:14pt;letter-spacing:2mm">
          <span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span>
        </div>
        <div style="font-size:14pt;letter-spacing:2mm;margin-top:4mm">
          <span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span><span class="box"></span>
        </div>
      </div>
      <div class="section-label">Prüfungs-Countdown</div>
      <table>
        <tbody>
          <tr><td class="c-mid">Nächste Prüfung</td><td></td></tr>
          <tr><td>Noch … Tage</td><td></td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="section-label">Notizen</div>
  <div class="lines"><div class="ln"></div><div class="ln"></div></div>

  <div class="footer"><span>Studien-Tracker · Fokus heute</span><span>Ein Blatt pro Tag</span></div>
</body>
</html>
